name: Run Jupyter Notebook

on:
  schedule:
    - cron: '0 8 * * *'  # Every day at 8 AM UTC
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install jupyter nbconvert papermill playwright nest_asyncio unidecode fastparquet pyarrow beautifulsoup4 pytz google-auth google-api-python-client google-auth-httplib2 scipy statsmodels textblob scikit-learn tqdm matplotlib tabulate lightgbm joblib
          playwright install chromium
          playwright install-deps chromium

      - name: Download files from Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          python download_drive_files.py

      - name: Run historical notebook
        id: run_notebook
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3"
            papermill PT_github_2026.ipynb output.ipynb && break
            echo "Attempt $i failed"
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            sleep 30
          done

      - name: Run today notebook
        id: run_today_notebook
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3"
            papermill PT_github_2026_today.ipynb output_today.ipynb && break
            echo "Attempt $i failed"
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            sleep 30
          done


      - name: Run prediction notebook
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3"
            papermill PT_Predictor_live.ipynb output_predictor.ipynb && break
            echo "Attempt $i failed"
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            sleep 30
          done

          

      - name: Run analysis notebook
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3"
            papermill PT_github_2026_Analysis_clean.ipynb output_analysis.ipynb && break
            echo "Attempt $i failed"
            if [ $i -eq 3 ]; then
              echo "All 3 attempts failed"
              exit 1
            fi
            sleep 30
          done

      - name: Upload analysis output files to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          python upload_analysis_files.py

      - name: Upload files back to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > credentials.json
          python upload_drive_files.py

      - name: Upload output notebooks
        uses: actions/upload-artifact@v4
        with:
          name: notebook-output
          path: |
            output.ipynb
            output_today.ipynb
            output_predictor.ipynb
            output_analysis.ipynb
